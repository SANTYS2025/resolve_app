<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000032" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root">
      <!--
        Fondo de espera mientras React monta: es el MISMO fondo del splash
        (public/splash/fondo.jpg), sin logo ni imagen estática. Así el primer
        fotograma visible ya es el de la animación y no hay un logo congelado
        antes de que arranque el video. El `<img>` de logo no debe volver aquí.
      -->
      <div role="status" aria-label="Cargando Resolve Pasto" style="position:fixed;inset:0;background:#000032 url('/splash/fondo.jpg') center/cover no-repeat"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
