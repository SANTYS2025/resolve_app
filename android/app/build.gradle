apply plugin: 'com.android.application'

/*
 * Firma de release.
 *
 * La contraseña del keystore NUNCA vive en el repositorio. Se lee, en orden:
 *   1. `-P` / `gradle.properties`
 *   2. `android/keystore.properties` (local, ignorado por Git)
 *   3. variables de entorno (GitHub Actions)
 *
 * Sin las cuatro variables, `bundleRelease`/`assembleRelease` fallan con un
 * mensaje claro en vez de producir un artefacto sin firmar.
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def leerFirma = { String clave, String variableEntorno ->
    def valor = project.findProperty(clave) ?: keystoreProperties.getProperty(clave) ?: System.getenv(variableEntorno)
    return valor == null ? '' : valor.toString().trim()
}

def firmaArchivo = leerFirma('RESOLVE_KEYSTORE_FILE', 'RESOLVE_KEYSTORE_FILE')
def firmaPassword = leerFirma('RESOLVE_KEYSTORE_PASSWORD', 'RESOLVE_KEYSTORE_PASSWORD')
def firmaAlias = leerFirma('RESOLVE_KEY_ALIAS', 'RESOLVE_KEY_ALIAS')
def firmaAliasPassword = leerFirma('RESOLVE_KEY_PASSWORD', 'RESOLVE_KEY_PASSWORD')

def firmaCompleta = [firmaArchivo, firmaPassword, firmaAlias, firmaAliasPassword].every { it != '' }
def firmaDisponible = firmaCompleta && file(firmaArchivo).exists()

android {
    namespace = "co.resolve.pasto"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.resolve.pasto"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (firmaDisponible) {
            release {
                storeFile file(firmaArchivo)
                storePassword firmaPassword
                keyAlias firmaAlias
                keyPassword firmaAliasPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 ofusca y elimina código no usado; shrinkResources quita recursos
            // que ya no referencia ninguna clase. Las reglas de Capacitor,
            // Firebase y los plugins viven en proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (firmaDisponible) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/*
 * Guardia de firma: si alguien pide un artefacto de release sin keystore,
 * Gradle se detiene con instrucciones en vez de publicar un AAB sin firmar.
 */
gradle.taskGraph.whenReady { graph ->
    def tareasRelease = graph.allTasks.findAll {
        it.name in ['bundleRelease', 'assembleRelease', 'packageRelease', 'packageReleaseBundle']
    }
    if (!tareasRelease.isEmpty() && !firmaDisponible) {
        throw new GradleException(
            "Falta la firma de release. Define RESOLVE_KEYSTORE_FILE, " +
            "RESOLVE_KEYSTORE_PASSWORD, RESOLVE_KEY_ALIAS y RESOLVE_KEY_PASSWORD " +
            "(variables de entorno o android/keystore.properties) y asegúrate de que " +
            "el archivo del keystore exista."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
