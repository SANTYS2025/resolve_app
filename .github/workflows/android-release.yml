name: Android Release

# Al empujar un tag v* (por ejemplo v1.0.0):
#   1. corre la suite y compila la app web,
#   2. exige los secretos de firma y falla con un mensaje claro si faltan,
#   3. genera el AAB firmado (Google Play) y un APK firmado (instalación directa),
#   4. los adjunta al Release del tag.
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   RESOLVE_KEYSTORE_BASE64     keystore .jks codificado en base64
#   RESOLVE_KEYSTORE_PASSWORD   contraseña del keystore
#   RESOLVE_KEY_ALIAS           alias de la clave
#   RESOLVE_KEY_PASSWORD        contraseña de la clave
#
# Opcional:
#   GOOGLE_SERVICES_JSON        contenido de android/app/google-services.json
#                               (sin él el AAB se compila pero sin push FCM)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar AAB/APK firmados y publicar Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (con Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar la app web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      # Falla antes de compilar si falta cualquier secreto de firma. Así el
      # error dice exactamente qué configurar, en vez de un "signingConfig"
      # opaco al final del build.
      - name: Verificar secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.RESOLVE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RESOLVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RESOLVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RESOLVE_KEY_PASSWORD }}
        run: |
          faltantes=()
          [[ -z "$KEYSTORE_BASE64" ]] && faltantes+=("RESOLVE_KEYSTORE_BASE64")
          [[ -z "$KEYSTORE_PASSWORD" ]] && faltantes+=("RESOLVE_KEYSTORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && faltantes+=("RESOLVE_KEY_ALIAS")
          [[ -z "$KEY_PASSWORD" ]] && faltantes+=("RESOLVE_KEY_PASSWORD")

          if (( ${#faltantes[@]} > 0 )); then
            echo "::error::Faltan secretos de firma: ${faltantes[*]}"
            echo "Configúralos en Settings → Secrets and variables → Actions."
            echo "El AAB de Google Play no se puede firmar sin ellos."
            exit 1
          fi
          echo "Secretos de firma presentes."

      - name: Decodificar el keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RESOLVE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
          if [[ ! -s android/keystore/release.jks ]]; then
            echo "::error::El keystore decodificado está vacío. Revisa RESOLVE_KEYSTORE_BASE64."
            exit 1
          fi
          ls -l android/keystore/release.jks

      # Sin google-services.json el AAB compila igual, pero FCM no entrega
      # push con la app cerrada. Se avisa sin romper el release.
      - name: Preparar google-services.json (opcional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json configurado."
          else
            echo "::warning::Falta GOOGLE_SERVICES_JSON: el AAB se compilará sin push FCM."
          fi

      - name: Ajustar versión al tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="1.0.0"
          fi
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            CODE=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
            sed -i "s/versionCode [0-9]\+/versionCode ${CODE}/" android/app/build.gradle
          fi
          grep -nE 'versionCode|versionName' android/app/build.gradle

      - name: Compilar AAB y APK firmados
        env:
          RESOLVE_KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/release.jks
          RESOLVE_KEYSTORE_PASSWORD: ${{ secrets.RESOLVE_KEYSTORE_PASSWORD }}
          RESOLVE_KEY_ALIAS: ${{ secrets.RESOLVE_KEY_ALIAS }}
          RESOLVE_KEY_PASSWORD: ${{ secrets.RESOLVE_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Verificar que los artefactos están firmados
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          for archivo in "$AAB" "$APK"; do
            if [[ ! -s "$archivo" ]]; then
              echo "::error::No se generó $archivo"
              exit 1
            fi
          done
          ls -lh "$AAB" "$APK"

      - name: Renombrar los artefactos con el tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/bundle/release/app-release.aab "ResolvePasto-${VERSION}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "ResolvePasto-${VERSION}.apk"
          ls -lh ResolvePasto-*.aab ResolvePasto-*.apk

      - name: Publicar el Release con AAB y APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ResolvePasto-*.aab
            ResolvePasto-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
